spring.application.name=monolith-shop
server.port=8080

# Supabase Postgres DataSource Configuration
# Values are provided via environment variables (SPRING_DATASOURCE_URL, etc.) or .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.txabiyeodojnqsxmlzwe}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:K0b31sthegreat!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool (tuned for Supabase transaction pooler on port 6543)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.connection-test-query=SELECT 1

# Inventory module configuration
inventory.low-stock-threshold=5
inventory.reorder-quantity=10

# LegacySupply Supplier API (read from env, never hardcode in repo)
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID:23-7763-917}
legacysupply.api-key=${LS_API_KEY:}

# Scheduling configuration
spring.task.scheduling.pool.size=3
